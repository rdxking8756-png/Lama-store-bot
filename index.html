<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="telegram-web-app-theme-color" content="#eef4fb">
  <meta name="telegram-web-app-header-color" content="#eef4fb">
  <title>LAMA Device Verification</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" defer></script>
</head>
<body>
  <main class="shell">
    <section class="card">
      <div class="device" aria-hidden="true"><span></span></div>
      <p class="eyebrow">LAMA STORE SECURITY</p>
      <h1>Device Verification</h1>
      <p class="intro">
        Complete the security check below to continue.
      </p>
      <div class="cf-turnstile" data-sitekey="0x4AAAAAAEBYBxH_v0tSy-2w5QzfEZzunTI" data-theme="light" data-callback="onTurnstileCallback" data-error-callback="onTurnstileError"></div>
      <p id="status" class="status"></p>
      <p class="privacy">
        We verify your Telegram session and challenge result. No password is requested.
      </p>
      <p class="watermark">Made by 🔐 <span>@itzrdxking</span></p>
    </section>
  </main>
  <script src="config.js"></script>
  <script src="verify.js"></script>
</body>
</html>
